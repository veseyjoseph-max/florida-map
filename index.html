function getRadius(e){if(e<300)return 8;if(e<600)return 11;if(e<1000)return 14;if(e<1500)return 17;if(e<2000)return 20;if(e<3000)return 23;return 27;}
function getColor(r){if(r<=5)return'#e94560';if(r<=10)return'#ff6b35';if(r<=20)return'#ffd700';if(r<=35)return'#4ecdc4';return'#95e1d3';}

const legend=L.control({position:'bottomright'});

rowingClubs.forEach(function(r){const marker=L.marker([r.lat,r.lng],{icon:rowingIcon()});marker.isRowing=true;marker.bindPopup('<div class="popup-title" style="color:#1a6b3c;">&#x1F6A3; '+r.name+'</div><div class="popup-rank-rowing">Youth Rowing Program</div><table class="popup-table"><tr><td>Location</td><td>'+r.city+', FL</td></tr><tr><td>Programs</td><td>'+r.programs+'</td></tr><tr><td>Highlight</td><td>'+r.highlight+'</td></tr></table><p class="popup-note" style="color:#444;">'+r.desc+'</p>',{maxWidth:300});marker.bindTooltip('<b>&#x1F6A3; '+r.name+'</b><br>'+r.city+', FL',{direction:'top',offset:[0,-20]});marker.addTo(map);window.rowingMarkers.push(marker);});

window.resetFilters=function(){document.getElementById('districtFilter').value='';document.getElementById('typeFilter').value='';document.getElementById('minRank').value=1;document.getElementById('maxRank').value=50;document.getElementById('showRowing').checked=true;window.allMarkers.forEach(m=>m.addTo(map));window.rowingMarkers.forEach(m=>m.addTo(map));document.getElementById('statusBar').textContent='50 schools + 6 rowing programs loaded. Click any marker for details.';};
window.fitAllMarkers=function(){const vis=[...window.allMarkers,...window.rowingMarkers].filter(m=>map.hasLayer(m));if(vis.length>0)map.fitBounds(L.featureGroup(vis).getBounds().pad(0.1));};
